<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lunara · Reviews</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2C40}a:hover{color:#2B1F27}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF7F2; color: #2B1F27; font-family: 'Poppins', sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 24px 20px 0;">

  <div style="display: flex; align-items: center; gap: 12px;">
    <a href="Product.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1px solid #EADFE3; background: #FFFFFF; color: #4A2C40; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; flex-direction: column;">
      <h1 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2;">Reviews</h1>
      <span style="font-size: 12px; color: #6B5E66;">Chiffon Breeze Shawl</span>
    </div>
  </div>

  <div style="display: flex; gap: 18px; align-items: center; padding: 16px; border-radius: 20px; background: #4A2C40; color: #FBF7F2;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0;">
      <span style="font-size: 40px; font-weight: 700; line-height: 1;">4.9</span>
      <span role="img" aria-label="4.9 out of 5 stars" style="display: flex; gap: 2px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#E8C26A" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9L12 2.5z"></path></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#E8C26A" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9L12 2.5z"></path></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#E8C26A" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9L12 2.5z"></path></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#E8C26A" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9L12 2.5z"></path></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#E8C26A" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9L12 2.5z"></path></svg>
      </span>
      <span style="font-size: 11px; color: #E8C4C4;">2,031 reviews</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px;">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 11px;">
          <span style="width: 8px;">{{b.star}}</span>
          <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #5C3A52; overflow: hidden;">
            <div style="height: 6px; border-radius: 3px; background: #E8C4C4; width: {{b.w}};"></div>
          </div>
          <span style="width: 28px; text-align: right; color: #E8C4C4;">{{b.w}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div role="group" aria-label="Filter reviews" style="display: flex; gap: 8px; flex-wrap: wrap;">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
      <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;">{{c.label}}</button>
    </sc-for>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding-bottom: 110px;">
    <sc-for list="{{reviews}}" as="r" hint-placeholder-count="2">
      <article style="padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #F0E6E8; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span aria-hidden="true" style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; background: {{r.avatarBg}}; color: #4A2C40; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{r.initial}}</span>
          <div style="flex-grow: 1; display: flex; flex-direction: column;">
            <span style="font-size: 14px; font-weight: 600;">{{r.name}}</span>
            <span style="font-size: 11px; color: #6B5E66;">{{r.meta}}</span>
          </div>
          <span role="img" aria-label="{{r.starLabel}}" style="display: flex; gap: 1px;">
            <sc-for list="{{r.stars}}" as="st" hint-placeholder-count="5">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="{{st.fill}}" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9L12 2.5z"></path></svg>
            </sc-for>
          </span>
        </div>
        <sc-if value="{{r.photos}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; gap: 8px;">
            <div style="width: 84px; height: 84px; border-radius: 12px; background: #EADFE3; color: #5A3446; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 8"></path></svg>Her look</div>
            <div style="width: 84px; height: 84px; border-radius: 12px; background: #E8C4C4; color: #5A3446; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 8"></path></svg>Close-up</div>
          </div>
        </sc-if>
        <p style="margin: 0; font-size: 13px; line-height: 1.5;">{{r.text}}</p>
        <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #4A2C40;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg>Verified Buyer</span>
      </article>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; box-sizing: border-box; padding: 14px 20px 24px; background: #FFFFFF; border-top: 1px solid #F0E6E8; display: flex;">
    <button type="button" style="flex-grow: 1; height: 58px; border-radius: 18px; border: none; background: #4A2C40; color: #FBF7F2; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v13H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Share Your Look · earn 50 Points</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { filter: 'all' };
renderVals() {
const f = this.state.filter;
const all = [
{ name: 'Aisyah', initial: 'A', meta: '22 · Student · 2 days ago', rating: 5, photos: true, tags: ['daily', 'photos'], avatarBg: '#E8C4C4', text: 'So breathable! I wore it all day on campus in the heat and it still looked neat.' },
{ name: 'Hanis', initial: 'H', meta: '27 · Office wear · 1 week ago', rating: 5, photos: false, tags: ['office'], avatarBg: '#E9EDE2', text: 'Colour is exactly like the picture. It doesn’t slip, so I only need one pin.' },
{ name: 'Siti', initial: 'S', meta: '31 · Daily wear · 2 weeks ago', rating: 4, photos: false, tags: ['daily'], avatarBg: '#F4E1E1', text: 'Lovely soft fabric and the Sage shade is so pretty. Delivery took 4 days.' }
];
const reviews = all
.filter((r) => f === 'all' || r.tags.indexOf(f) !== -1)
.map((r) => ({
...r,
starLabel: r.rating + ' out of 5 stars',
stars: [1, 2, 3, 4, 5].map((n) => ({ fill: n <= r.rating ? '#C9A227' : '#EADFE3' }))
}));
const chips = [
{ id: 'all', label: 'All' },
{ id: 'daily', label: 'Daily wear' },
{ id: 'office', label: 'Office' },
{ id: 'photos', label: 'With photos' }
].map((c) => {
const on = c.id === f;
return {
...c,
pressed: on ? 'true' : 'false',
bg: on ? '#4A2C40' : '#FFFFFF',
fg: on ? '#FBF7F2' : '#2B1F27',
border: on ? '#4A2C40' : '#EADFE3',
pick: () => this.setState({ filter: c.id })
};
});
const bars = [
{ star: '5', w: '88%' },
{ star: '4', w: '8%' },
{ star: '3', w: '3%' },
{ star: '2', w: '1%' },
{ star: '1', w: '0%' }
];
return { reviews, chips, bars };
}
}
</script>
</body>
</html>
